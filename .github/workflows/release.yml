name: release

# Publishing is driven by the tag, and the tag is made by `npm version`, so there is
# exactly one command to remember and no way to publish a version that was never
# tagged. The job re-checks that the tag matches package.json before it publishes -
# a tag pushed by hand that disagrees with the manifest is refused rather than
# published under the wrong number.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write          # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing is an npm CLI feature, not a registry-side one: the
      # client is what exchanges the Actions OIDC token for a short-lived
      # publish token. It landed in npm 11.5.1, and whatever npm ships inside
      # the Node image is not a version this workflow controls.
      - name: npm new enough to do OIDC
        run: |
          npm install -g npm@latest
          npm --version

      - name: Tag must match package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG package.json=$PKG"
          [ "$TAG" = "$PKG" ] || {
            echo "::error::tag $GITHUB_REF_NAME does not match package.json $PKG"
            exit 1
          }

      # The same check that guards `npm version` locally: versions agree across
      # package.json, SKILL.md and every platform template, every shipped path
      # exists, and the row counts in the verification CSVs still match the numbers
      # SKILL.md quotes.
      - name: Release checks
        run: node bin/check-release.mjs

      - name: Installer must run
        run: |
          node bin/install.mjs --list
          node bin/install.mjs --dry-run claude-code

      - name: Show exactly what will ship
        run: npm pack --dry-run

      # Published through npm trusted publishing (OIDC), so there is no NPM_TOKEN
      # and no long-lived credential in this repository at all: npm trusts this
      # exact workflow file in this exact repository, and the `id-token: write`
      # permission above is what lets the CLI prove it. Provenance is attached
      # automatically - passing --provenance would be redundant.
      #
      # Idempotent: a re-run of an already-published tag should be a no-op, not a
      # red X. A version can only be published once, and 1.2.0 went out by hand
      # before any of this existed.
      - name: Publish
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "::notice::$NAME@$VER is already on npm; nothing to publish"
            exit 0
          fi
          npm publish --access public

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
